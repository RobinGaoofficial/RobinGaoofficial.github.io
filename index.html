---
layout: null
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robin 的博客</title>
  <style>
    body {
      max-width: 760px;
      margin: 60px auto;
      padding: 0 24px;
      font-family: system-ui, sans-serif;
      line-height: 1.8;
      color: #263238;
      background: #faf9f6;
    }

    h1 {
      color: #226655;
    }

    article {
      margin-top: 32px;
      padding: 24px;
      background: white;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Robin 的博客</h1>
    <p>活在想象之外。</p>
  </header>

  <main>
    {% for post in site.posts %}
      <article>
        <h2>
          <a href="{{ post.url | relative_url }}">
            {{ post.title | escape }}
          </a>
        </h2>
        <p>{{ post.date | date: "%Y-%m-%d" }}</p>
        {{ post.excerpt }}
      </article>
    {% endfor %}

    <article>
      <h2>
        <a href="/posts/hello-world.html">你好，世界！</a>
      </h2>
      <p>这是我的第一篇博客，也是最初的 HTML 练习。</p>
    </article>
  </main>
</body>
</html>
