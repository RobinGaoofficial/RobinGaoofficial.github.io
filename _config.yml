title: 高彬斌的博客
description: 记录学习、思考，以及探索新事物的经历。活在想象之外
url: https://robingaoofficial.github.io
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
markdown: kramdown
permalink: /posts/:title.html
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      categories: [随笔]
exclude:
  - README.md
  - tools
  - templates
  - tests
  - package.json
  - package-lock.json
  - node_modules
  - Gemfile
  - Gemfile.lock
  - docs

